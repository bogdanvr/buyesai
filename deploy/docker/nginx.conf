# The host Nginx overwrites these headers; Compose publishes this listener
# exclusively on 127.0.0.1. Do not expose it publicly while trusting them.
map $http_x_forwarded_proto $buyesai_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map $http_x_real_ip $buyesai_client_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

upstream buyesai_django {
    zone buyesai_django 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server web:8000 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;

    location /assets/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://buyesai_django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $buyesai_client_ip;
        proxy_set_header X-Forwarded-For $buyesai_client_ip;
        proxy_set_header X-Forwarded-Proto $buyesai_forwarded_proto;
        proxy_connect_timeout 10s;
        # PDF conversion may take up to 180 seconds.
        proxy_read_timeout 240s;
    }
}
