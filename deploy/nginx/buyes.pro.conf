# Install on the host, inside the http context (Ubuntu: sites-enabled).
# Certbot adds the TLS listener and HTTP-to-HTTPS redirect after installation.
upstream buyesai_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name buyes.pro;
    server_tokens off;
    client_max_body_size 50m;

    location / {
        proxy_pass http://buyesai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite client-supplied forwarding headers at the public boundary.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
    }
}
